map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP is kept only for ACME renewal and HTTPS redirects.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name damumu.com www.damumu.com admin.damumu.com api.damumu.com app.damumu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name damumu.com;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.damumu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.damumu.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.damumu.com;
    server_tokens off;
    client_max_body_size 3m;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "DAMUMU Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-damumu-admin;

    location /api/v1/realtime {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.damumu.com;
    server_tokens off;
    client_max_body_size 3m;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep the static Admin key behind the Admin host's additional Basic Auth.
    location = /api/v1/admin {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location /api/v1/realtime {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.damumu.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
    }
}
