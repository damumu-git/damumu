name: damumu

services:
  api:
    build:
      context: ../restapi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Muda: ${DATABASE_CONNECTION}
      Auth__TokenKey: ${AUTH_TOKEN_KEY}
      SocialLogin__google__Enabled: ${GOOGLE_LOGIN_ENABLED:-false}
      SocialLogin__google__ClientId: ${GOOGLE_SERVER_CLIENT_ID:-}
      SocialLogin__kakao__Enabled: ${KAKAO_LOGIN_ENABLED:-false}
      SocialLogin__kakao__AppId: ${KAKAO_APP_ID:-}
      WebSocialLogin__google__ClientId: ${GOOGLE_WEB_CLIENT_ID:-}
      WebSocialLogin__google__ClientSecret: ${GOOGLE_WEB_CLIENT_SECRET:-}
      WebSocialLogin__kakao__ClientId: ${KAKAO_WEB_REST_KEY:-}
      WebSocialLogin__kakao__ClientSecret: ${KAKAO_WEB_CLIENT_SECRET:-}
      Admin__ApiKey: ${ADMIN_API_KEY}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Media__RootPath: /var/lib/damumu/uploads
      Media__PublicBaseUrl: ${MEDIA_PUBLIC_BASE_URL:-https://api.damumu.com/uploads}
      Privacy__ExternalPushApproved: "false"
      ActivityTranslation__Enabled: ${ACTIVITY_TRANSLATION_ENABLED:-false}
      ActivityTranslation__Endpoint: ${ACTIVITY_TRANSLATION_ENDPOINT:-}
      ActivityTranslation__ApiKey: ${ACTIVITY_TRANSLATION_API_KEY:-}
    ports:
      - 127.0.0.1:8080:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - backend
    volumes:
      - type: bind
        source: /srv/damumu/uploads
        target: /var/lib/damumu/uploads
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  site:
    build:
      context: ../website
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  app-web:
    build:
      context: ..
      dockerfile: app-web/Dockerfile.source
    restart: unless-stopped
    ports:
      - 127.0.0.1:8083:80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ../admin
      args:
        # Admin calls the API through the same protected admin.damumu.com
        # origin. Host Nginx proxies /api/ to the API container.
        VITE_API_BASE: /api/v1
        VITE_BASE: /
        VITE_ADMIN_KEY: ${ADMIN_API_KEY}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8082:80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
