<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搭慕 · iOS 启动画面</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #edf3f7;
    }
    main {
      width: min(390px, calc(100vw - 48px), calc((100dvh - 48px) * 390 / 844));
      aspect-ratio: 390 / 844;
      display: grid;
      place-items: center;
      container-type: inline-size;
      border-radius: 42px;
      background: #7cb8e4;
      box-shadow: 0 12px 36px #23476b26;
    }
    img { width: calc(100cqw * 112 / 390); height: auto; }
    @media (max-width: 480px) {
      main { width: 100%; min-height: 100dvh; aspect-ratio: auto; border-radius: 0; }
      img { width: 112px; }
    }
  </style>
</head>
<body>
  <main aria-label="iOS 启动画面">
    <img src="../../app/ios/Runner/Assets.xcassets/LaunchMark.imageset/LaunchMark.svg" alt="搭慕" width="112" height="112">
  </main>
</body>
</html>
