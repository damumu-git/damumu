services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: damumu-postgres-test
    environment:
      POSTGRES_DB: damumu_test
      POSTGRES_USER: damumu
      POSTGRES_PASSWORD: damumu-local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U damumu -d damumu_test &&
          psql -U damumu -d damumu_test -tAc
          "SELECT 1 FROM pg_extension WHERE extname='postgis'" | grep -q 1
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - damumu-postgres-test-data:/var/lib/postgresql/data

volumes:
  damumu-postgres-test-data:
