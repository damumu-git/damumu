server {
    listen 80;
    listen [::]:80;
    server_name app.damumu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://app.damumu.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.damumu.com;
    ssl_certificate /etc/letsencrypt/live/app.damumu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.damumu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
    }
}
