server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ \.(?:js|json|wasm|css|woff2?|ttf|png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
