server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.damumu.com; img-src 'self' blob: https://api.damumu.com; frame-src https://www.openstreetmap.org; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    location = /index.html {
        expires -1;
    }

    location ~ \.(?:js|json|wasm|css|woff2?|ttf|png|jpe?g|webp|svg|ico)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
