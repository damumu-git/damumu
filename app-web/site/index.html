<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="在搭慕发现韩国本地的线下活动，找到想一起出门的人。"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>探索活动 · 搭慕 DAMU</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/neighborhood.css" />
    <script type="module" src="/site.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <header class="masthead">
      <a class="brand" href="/" aria-label="搭慕首页"
        ><img src="/assets/logo.png" alt="" /><span
          >DAMU<small>搭慕</small></span
        ></a
      >
      <nav aria-label="主导航">
        <a href="/explore">发现活动</a>
        <a href="/guides">周末指南</a>
        <a href="/series">活动系列</a>
        <a href="/groups">小组</a>
        <a id="messages-menu" href="/messages" hidden>消息 <span class="message-count" hidden></span></a>
      </nav>
      <div class="account">
        <a id="login" class="button ghost" href="/login">登录</a>
        <details id="my-menu" class="my-menu" hidden>
          <summary class="avatar-trigger" aria-label="我的"><span class="account-avatar" aria-hidden="true"></span></summary>
          <ul aria-label="我的" class="my-menu-links">
            <li><a href="/me/activities">我的活动</a></li>
            <li><a href="/me/saved">我的收藏</a></li>
            <li><a href="/me/following">我的关注</a></li>
            <li><a href="/notifications">通知</a></li>
            <li><a href="/settings/profile">个人资料</a></li>
          </ul>
        </details>
        <a class="button primary" href="/activities/new">＋ 发起活动</a>
      </div>
    </header>
    <main id="main">
      <div id="page" hidden></div>
      <div id="browse" hidden>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-art" aria-hidden="true">
            <i></i><i></i><i></i><span>OUT<br />TOGETHER<span>.</span></span>
          </div>
          <div class="hero-copy">
            <p class="eyebrow"><span></span> 韩国线下活动社区</p>
            <h1 id="hero-title">找点想做的，<br />找人一起去<span>。</span></h1>
            <p class="intro">
              周末去哪儿？从一场散步、一杯咖啡，或一次新的体验开始。
            </p>
            <form id="search" class="search" role="search">
              <label class="sr-only" for="query">搜索活动</label>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 4 4" />
              </svg>
              <input
                id="query"
                type="search"
                placeholder="搜索活动，例如散步、咖啡、桌游"
              />
              <button class="button primary" type="submit">搜索</button>
            </form>
          </div>
        </section>
        <section id="gallery" class="gallery" aria-labelledby="gallery-title">
          <div class="toolbar">
            <div>
              <h2 id="gallery-title">活动列表</h2>
            </div>
          </div>
          <div id="filters" class="filters" role="group" aria-label="活动筛选">
            <div id="region-filter"></div>
            <div id="date-filters" role="group" aria-label="日期筛选"></div>
            <select id="max-price" data-label="预算" hidden>
              <option value="">不限</option>
              <option value="0">免费</option>
              <option value="10000">₩10,000 以内</option>
              <option value="30000">₩30,000 以内</option>
            </select>
            <select id="sort" data-label="排序" hidden>
              <option value="recommended">即将开始</option>
              <option value="newest">最新发布</option>
            </select>
          </div>
          <div id="categories" class="category-filters"></div>
          <p id="status" class="status" role="status"></p>
          <div id="cards" class="cards"></div>
          <div class="more">
            <button id="more" class="button ghost" hidden>加载更多活动</button>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <span><strong>DAMU</strong> 搭慕 · 韩国线下活动社区</span>
      <div class="footer-links">
        <a href="/download">下载 App</a>
        <a href="/interests">想一起去</a>
        <a href="/calendar">活动日历</a>
        <a href="/map">地区地图</a>
        <a href="/places">地区专题</a>
        <a href="/categories">分类专题</a>
        <a href="/explore?feed=following">关注动态</a>
        <a href="/me/saved">收藏</a>
        <a href="/feedback">反馈</a>
        <a href="/help">帮助</a><a href="/safety">见面安全</a
        ><a href="/privacy">隐私政策</a>
        <a href="/terms">社区规则</a>
      </div>
    </footer>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button id="close" class="close" aria-label="关闭">×</button>
      <div id="panel"></div>
    </dialog>
  </body>
</html>
